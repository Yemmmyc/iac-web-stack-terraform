name: Terraform and Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t iac-web-stack:ci .

      - name: Start container
        run: docker run -d --name iac-web-stack-ci -p 8080:80 iac-web-stack:ci

      - name: Wait for application
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8080 > /dev/null; then
              echo "Application is responding."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not become ready."
          docker logs iac-web-stack-ci
          exit 1

      - name: Verify HTTP response
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8080)
          echo "HTTP status: $status"
          test "$status" = "200"

      - name: Stop and remove container
        if: always()
        run: docker rm -f iac-web-stack-ci
